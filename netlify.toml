[build]
  base = "."
  command = "npm install"
  publish = "client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Cache headers: HTML nunca se cachea, assets corto tiempo
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"