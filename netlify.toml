[build]
  base = "."
  command = "npm install"
  publish = "client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  # RESEND_FROM es un email público (no es secreto).
  # RESEND_API_KEY aparece en api.js solo como process.env reference, no hardcodeado,
  # pero el scanner lo detecta en el build output de la función serverless.
  SECRETS_SCAN_OMIT_KEYS = "RESEND_FROM,RESEND_API_KEY"

# Cache headers: HTML nunca se cachea, assets corto tiempo
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"