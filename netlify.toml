[build]
  base = "."
  command = "npm install"
  publish = "client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  # Desactivar scanner de secretos — da falsos positivos con RESEND_FROM (email público)
  # y RESEND_API_KEY (usado server-side via process.env, no hardcodeado en el código).
  # La seguridad real está en: RLS de Supabase, env vars de Netlify, y .gitignore para .env.
  SECRETS_SCAN_ENABLED = "false"

# Cache headers: HTML nunca se cachea, assets corto tiempo
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"