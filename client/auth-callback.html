<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>Conectando… · Cuidy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-callback">
    <div class="auth-callback__box">
      <div class="auth-callback__spinner"></div>
      <p class="auth-callback__text">Conectando tu cuenta…</p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Google OAuth redirige con hash: #access_token=...&token_type=bearer&...
    (async () => {
      try {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');

        if (!accessToken) {
          throw new Error('No se recibió token de autenticación');
        }

        // Obtener datos del usuario desde Supabase
        const user = await supabaseAuth.getUser(accessToken);
        if (user.error) throw new Error(user.error.message || 'Error al obtener usuario');

        const meta = user.user_metadata || {};
        const nombre = meta.full_name?.split(' ')[0] || meta.name?.split(' ')[0] || '';
        const apellido = meta.full_name?.split(' ').slice(1).join(' ') || '';
        const email = user.email;

        const API = '/.netlify/functions/api';

        // Determinar rol: familia o cuidador
        const authRole = sessionStorage.getItem('cuidy_auth_role') || 'familia';
        sessionStorage.removeItem('cuidy_auth_role');

        if (authRole === 'cuidador') {
          // === FLUJO CUIDADOR ===
          const res = await fetch(`${API}/cuidadores/me?email=${encodeURIComponent(email)}`);
          const json = await res.json();

          if (!json.ok || !json.data) {
            throw new Error('No encontramos una cuenta de cuidador/a con este email. Primero tenés que registrarte.');
          }

          localStorage.setItem('qqmc_cuidador', JSON.stringify(json.data));
          window.location.href = '/panel-cuidador.html';

        } else {
          // === FLUJO FAMILIA ===
          const res = await fetch(`${API}/familias/me?email=${encodeURIComponent(email)}`);
          const json = await res.json();

          if (!json.ok || !json.data) {
            throw new Error('No encontramos una cuenta de familia con este email. Primero tenés que registrarte.');
          }

          const familiaData = json.data;

          saveSession(
            { access_token: accessToken, user: { id: user.id, email, user_metadata: meta } },
            { id: familiaData.id, nombre: familiaData.nombre || nombre, apellido: familiaData.apellido || apellido, email, telefono: familiaData.telefono || '' }
          );

          window.location.href = '/';
        }
      } catch (err) {
        document.querySelector('.auth-callback__spinner').style.display = 'none';
        const box = document.querySelector('.auth-callback__box');
        const role = sessionStorage.getItem('cuidy_auth_role') || 'familia';
        sessionStorage.removeItem('cuidy_auth_role');

        const regLink = role === 'cuidador' ? '/registro-cuidador.html' : '/registro-familia.html';
        const loginLink = '/login.html' + (role === 'cuidador' ? '?rol=cuidador' : '');

        box.innerHTML = `
          <p style="font-size:2rem;margin:0 0 16px"><span class="ci ci--xl ci--muted"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></span></p>
          <p style="color:var(--ink);font-size:1rem;margin:0 0 20px">${err.message}</p>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
            <a href="${regLink}" class="btn btn--primary">Registrarme</a>
            <a href="${loginLink}" class="btn btn--ghost">Volver al login</a>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
