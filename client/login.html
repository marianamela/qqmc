<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>Ingresar · Cuidy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="auth-card__logo">
        <img src="assets/logo.svg" alt="Cuidy" />
      </a>
      <h1 class="auth-card__title">Ingresá a tu cuenta</h1>

      <!-- Tabs de rol -->
      <div class="auth-tabs">
        <button class="auth-tab is-active" data-role="familia">Soy familia</button>
        <button class="auth-tab" data-role="cuidador">Soy cuidador/a</button>
      </div>

      <!-- ===== PANEL FAMILIA ===== -->
      <div class="auth-panel is-active" id="panelFamilia">
        <!-- Google SSO -->
        <button class="auth-google" id="btnGoogle" type="button">
          <svg class="auth-google__icon" viewBox="0 0 24 24" width="20" height="20">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continuar con Google
        </button>

        <div class="auth-divider"><span>o con tu email</span></div>

        <form class="auth-form" id="loginFormFamilia">
          <input type="email" id="loginEmailFam" class="auth-input" placeholder="Email" required autocomplete="email" />
          <input type="password" id="loginPasswordFam" class="auth-input" placeholder="Contraseña" required autocomplete="current-password" />
          <button type="submit" class="btn btn--primary btn--full" id="btnLoginFam">Ingresar</button>
        </form>

        <div class="auth-error hidden" id="loginErrorFam"></div>

        <div class="auth-links">
          <p>¿No tenés cuenta? <a href="registro-familia.html">Registrate como familia</a></p>
        </div>
      </div>

      <!-- ===== PANEL CUIDADOR ===== -->
      <div class="auth-panel" id="panelCuidador">
        <!-- Google SSO -->
        <button class="auth-google" id="btnGoogleCuid" type="button">
          <svg class="auth-google__icon" viewBox="0 0 24 24" width="20" height="20">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continuar con Google
        </button>

        <div class="auth-divider"><span>o con tu email</span></div>

        <form class="auth-form" id="loginFormCuidador">
          <input type="email" id="loginEmailCuid" class="auth-input" placeholder="Email" required autocomplete="email" />
          <input type="password" id="loginPasswordCuid" class="auth-input" placeholder="Contraseña" required autocomplete="current-password" />
          <button type="submit" class="btn btn--primary btn--full" id="btnLoginCuid">Ingresar</button>
        </form>

        <div class="auth-error hidden" id="loginErrorCuid"></div>

        <div class="auth-links">
          <p>¿No tenés cuenta? <a href="sumate-cuidador.html">Sumate como cuidador/a</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // API ya está definida en auth.js

    // === Tabs ===
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('is-active'));
        document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('is-active'));
        tab.classList.add('is-active');
        const role = tab.dataset.role;
        document.getElementById(role === 'familia' ? 'panelFamilia' : 'panelCuidador').classList.add('is-active');
        // Limpiar errores al cambiar tab
        document.querySelectorAll('.auth-error').forEach(e => e.classList.add('hidden'));
      });
    });

    // Si viene con ?rol=cuidador, activar esa tab
    const urlRole = new URLSearchParams(window.location.search).get('rol');
    if (urlRole === 'cuidador') {
      document.querySelector('.auth-tab[data-role="cuidador"]').click();
    }

    // === Login con Google (ambos roles) ===
    document.getElementById('btnGoogle').addEventListener('click', () => {
      sessionStorage.setItem('cuidy_auth_role', 'familia');
      authGoogle();
    });
    document.getElementById('btnGoogleCuid').addEventListener('click', () => {
      sessionStorage.setItem('cuidy_auth_role', 'cuidador');
      authGoogle();
    });

    document.getElementById('loginFormFamilia').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmailFam').value.trim();
      const password = document.getElementById('loginPasswordFam').value;
      const btn = document.getElementById('btnLoginFam');
      const error = document.getElementById('loginErrorFam');
      error.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Ingresando…';
      try {
        await authLogin(email, password);
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });

    // === Login Cuidador (endpoint propio) ===
    document.getElementById('loginFormCuidador').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmailCuid').value.trim();
      const password = document.getElementById('loginPasswordCuid').value;
      const btn = document.getElementById('btnLoginCuid');
      const error = document.getElementById('loginErrorCuid');
      error.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Ingresando…';
      try {
        const res = await fetch(`${API}/cuidadores/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Email o contraseña incorrectos');

        // Guardar sesión del cuidador
        localStorage.setItem('qqmc_cuidador', JSON.stringify(json.data));
        window.location.href = '/panel-cuidador.html';
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
