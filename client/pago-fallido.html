<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <title>Pago no procesado · Cuidy</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .pago-result {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: linear-gradient(180deg, #fef2f2 0%, #fff 40%);
    }
    .pago-card {
      background: #fff; border-radius: 20px; padding: 40px 32px; text-align: center;
      max-width: 420px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,.08);
    }
    .pago-card__icon { font-size: 56px; margin-bottom: 16px; }
    .pago-card__title { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
    .pago-card__text { font-size: 14px; color: #6b7280; line-height: 1.5; margin-bottom: 24px; }
    .pago-card__btn {
      display: inline-block; padding: 12px 32px; background: var(--teal);
      color: #fff; border-radius: 10px; text-decoration: none; font-weight: 700;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="pago-result">
    <div class="pago-card">
      <div class="pago-card__icon">😕</div>
      <h1 class="pago-card__title">El pago no se pudo procesar</h1>
      <p class="pago-card__text">
        No te preocupes, no se realizó ningún cobro. Podés intentarlo
        nuevamente o elegir otro medio de pago.
      </p>
      <a href="/" class="pago-card__btn">Volver al inicio</a>
    </div>
  </div>
</body>
</html>
