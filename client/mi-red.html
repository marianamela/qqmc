<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>Mi Red · Cuidy</title>
  <meta name="description" content="Gestioná tus conexiones con otras familias en tu red de confianza Cuidy." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <script src="js/analytics.js"></script>
</head>
<body>
  <!-- Navbar -->
  <header class="topbar">
    <div class="container topbar__row">
      <a class="brand" href="/" aria-label="Cuidy">
        <img class="brand__logo" src="assets/logo.svg" alt="Cuidy" />
      </a>
      <nav class="topbar__nav">
        <a href="feed-familia.html">Inicio</a>
        <a href="#" id="navBuscar">Buscar</a>
        <a href="mi-red.html" class="topbar__nav-active">Mi Red</a>
        <div class="user-menu" id="userMenu">
          <button class="user-menu__trigger" id="userMenuBtn">
            <span class="user-menu__avatar" id="userAvatar"></span>
            <span class="user-menu__name" id="userName"></span>
            <svg class="user-menu__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div class="user-menu__dropdown hidden" id="userDropdown">
            <button class="user-menu__item" id="menuMisContactos"><span class="ci"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></span> Mis contactos</button>
            <button class="user-menu__item" id="menuRecomendar"><span class="ci" style="color:#f59e0b"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span> Recomendar cuidador</button>
            <button class="user-menu__item" id="menuMisDatos"><span class="ci"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span> Mis datos</button>
            <hr class="user-menu__divider" />
            <button class="user-menu__item user-menu__item--logout" id="menuSalir">Cerrar sesión</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="mi-red-page">
    <div class="container">
      <!-- Header -->
      <div class="mi-red-header">
        <h1 class="mi-red-header__title">Mi Red</h1>
        <p class="mi-red-header__sub" id="redCount">Cargando…</p>
      </div>

      <!-- Action buttons -->
      <div class="mi-red-actions">
        <button class="btn btn--primary" id="btnInvitarWA">Invitar por WhatsApp</button>
        <button class="btn btn--ghost" id="btnBuscarFam">Buscar familia</button>
      </div>

      <!-- Search -->
      <input type="text" class="form-input mi-red-search" id="searchInput" placeholder="Buscar en mi red…" />

      <!-- Pending requests -->
      <div id="pendingSection" class="hidden">
        <h3 class="mi-red-section-title" style="color:var(--coral)">Solicitudes pendientes</h3>
        <div id="pendingList"></div>
      </div>

      <!-- Connected families -->
      <div id="connectedSection">
        <h3 class="mi-red-section-title" style="color:var(--teal)">Familias conectadas</h3>
        <div id="connectedList">
          <p style="color:#999;font-size:13px;text-align:center;padding:20px 0">Cargando…</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Mobile tab bar -->
  <nav class="tab-bar">
    <a href="feed-familia.html" class="tab-bar__item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12 L12 4 L21 12 V20 H3 Z"/></svg>
      <span>Inicio</span>
    </a>
    <a href="#" class="tab-bar__item" id="tabBuscar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>Buscar</span>
    </a>
    <a href="mi-red.html" class="tab-bar__item tab-bar__item--active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7"/></svg>
      <span>Mi Red</span>
    </a>
    <a href="#" class="tab-bar__item" id="tabDiario">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/></svg>
      <span>Diario</span>
    </a>
  </nav>

  <!-- Modal Invitar -->
  <div id="modalInvitar" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal__backdrop" data-close-invitar></div>
    <div class="modal__content" style="max-width:440px">
      <button class="modal__close" aria-label="Cerrar" data-close-invitar>&times;</button>
      <h2 style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:20px;margin-bottom:4px">Invitá familias a tu red</h2>
      <p style="font-size:13px;color:#888;margin-bottom:20px">Compartí tu enlace de invitación.</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn--primary" id="btnInvitarWAModal">Enviar por WhatsApp</button>
        <button class="btn btn--ghost" id="btnCopiarLink">Copiar enlace</button>
      </div>
      <p id="invitarStatus" style="font-size:12px;color:var(--teal);text-align:center;margin-top:12px"></p>
    </div>
  </div>

  <!-- Modal Buscar familia -->
  <div id="modalBuscarFam" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal__backdrop" data-close-buscar-fam></div>
    <div class="modal__content" style="max-width:440px">
      <button class="modal__close" aria-label="Cerrar" data-close-buscar-fam>&times;</button>
      <h2 style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:20px;margin-bottom:4px">Buscar familias</h2>
      <p style="font-size:13px;color:#888;margin-bottom:16px">Buscá por nombre o email para conectar.</p>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <input type="text" id="buscarFamInput" class="form-input" placeholder="Nombre o email…" style="flex:1" />
        <button class="btn btn--primary" id="btnBuscarFamSubmit">Buscar</button>
      </div>
      <div id="buscarFamResults"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer__row">
      <span>© <span id="year"></span> Cuidy</span>
      <em class="footer__tagline">Cuidy. Tu red de confianza para el cuidado.</em>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="icons.js"></script>
  <script>
  (function() {
    const API = '/.netlify/functions/api';

    document.getElementById('year').textContent = new Date().getFullYear();

    // Auth check
    const session = typeof getSession === 'function' ? getSession() : null;
    if (!session?.id) {
      window.location.href = 'login.html';
      return;
    }

    const familiaId = session.id;
    const nombre = session.nombre || '';

    // User menu
    const avatar = document.getElementById('userAvatar');
    const nameEl = document.getElementById('userName');
    if (avatar) avatar.textContent = nombre.charAt(0).toUpperCase();
    if (nameEl) nameEl.textContent = nombre;

    const menuBtn = document.getElementById('userMenuBtn');
    const dropdown = document.getElementById('userDropdown');
    if (menuBtn && dropdown) {
      menuBtn.addEventListener('click', () => dropdown.classList.toggle('hidden'));
      document.addEventListener('click', (e) => {
        if (!menuBtn.contains(e.target) && !dropdown.contains(e.target)) dropdown.classList.add('hidden');
      });
    }

    document.getElementById('menuSalir')?.addEventListener('click', () => {
      if (typeof logout === 'function') logout();
      window.location.href = '/';
    });
    document.getElementById('menuMisDatos')?.addEventListener('click', () => window.location.href = 'mis-datos.html');
    document.getElementById('menuMisContactos')?.addEventListener('click', () => window.location.href = 'mis-contactos.html');
    document.getElementById('menuRecomendar')?.addEventListener('click', () => window.location.href = 'recomendar.html');
    document.getElementById('navBuscar')?.addEventListener('click', (e) => { e.preventDefault(); window.location.href = '/#asistente'; });
    document.getElementById('tabBuscar')?.addEventListener('click', (e) => { e.preventDefault(); window.location.href = '/#asistente'; });

    // Load connections
    loadConexiones();

    async function loadConexiones() {
      try {
        const res = await fetch(`${API}/red/conexiones?familia_id=${familiaId}`);
        const data = await res.json();

        const conexiones = data.data?.conexiones || [];
        const pendientes = data.data?.pendientes || [];

        document.getElementById('redCount').textContent = `${conexiones.length} familia${conexiones.length !== 1 ? 's' : ''} conectada${conexiones.length !== 1 ? 's' : ''}`;

        // Render pending
        if (pendientes.length) {
          document.getElementById('pendingSection').classList.remove('hidden');
          renderPendientes(pendientes);
        }

        // Render connected
        renderConectadas(conexiones);
      } catch (err) {
        console.error('Error loading connections:', err);
        document.getElementById('connectedList').innerHTML = '<p style="color:var(--coral);font-size:13px;text-align:center">Error al cargar conexiones.</p>';
      }
    }

    function renderPendientes(pendientes) {
      const container = document.getElementById('pendingList');
      container.innerHTML = pendientes.map(p => {
        const init = (p.nombre || '?').charAt(0).toUpperCase();
        return `
          <div class="pending-card" data-id="${p.conexion_id}">
            <p style="font-size:11px;color:#888;margin-bottom:6px">Solicitud pendiente</p>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
              <div style="width:36px;height:36px;border-radius:50%;background:var(--gris);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600">${init}</div>
              <span style="font-size:14px;font-weight:500">${esc(p.nombre || '')} ${esc(p.apellido || '')}</span>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn--sm btn--primary btn-aceptar" data-id="${p.conexion_id}">Aceptar</button>
              <button class="btn btn--sm btn--ghost btn-rechazar" data-id="${p.conexion_id}">Rechazar</button>
            </div>
          </div>`;
      }).join('');

      container.querySelectorAll('.btn-aceptar').forEach(btn => {
        btn.addEventListener('click', () => responder(btn.dataset.id, 'aceptar', btn));
      });
      container.querySelectorAll('.btn-rechazar').forEach(btn => {
        btn.addEventListener('click', () => responder(btn.dataset.id, 'rechazar', btn));
      });
    }

    async function responder(conexionId, accion, btn) {
      btn.disabled = true;
      try {
        await fetch(`${API}/red/responder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conexion_id: conexionId, accion })
        });
        const card = btn.closest('.pending-card');
        if (card) {
          card.style.opacity = '0.5';
          card.innerHTML = `<p style="text-align:center;color:${accion === 'aceptar' ? 'var(--teal)' : '#999'};font-size:13px;padding:12px">${accion === 'aceptar' ? 'Conexión aceptada ✓' : 'Solicitud rechazada'}</p>`;
        }
        // Reload after a beat
        setTimeout(loadConexiones, 1500);
      } catch {
        btn.disabled = false;
      }
    }

    function renderConectadas(conexiones) {
      const container = document.getElementById('connectedList');
      if (!conexiones.length) {
        container.innerHTML = '<div class="empty-state" style="padding:32px 0"><p style="color:#888;font-size:13px">Todavía no tenés familias conectadas. Invitá a familias que conocés para empezar a construir tu red.</p></div>';
        return;
      }
      container.innerHTML = conexiones.map(c => {
        const init = (c.nombre || '?').charAt(0).toUpperCase();
        const colors = ['var(--coral)', 'var(--aqua)', 'var(--teal)', '#f59e0b', '#8b5cf6'];
        const color = colors[init.charCodeAt(0) % colors.length];
        const meta = [c.localidad, c.recomendaciones_count ? `${c.recomendaciones_count} cuidadores recomendados` : null].filter(Boolean).join(' · ');
        return `
          <div class="profile-card" data-nombre="${esc((c.nombre || '').toLowerCase())}">
            <div class="profile-card__avatar" style="background:${color}">${init}</div>
            <div class="profile-card__info">
              <div class="profile-card__name">${esc(c.nombre || '')} ${esc(c.apellido || '')}</div>
              <div class="profile-card__meta">${esc(meta)}</div>
            </div>
          </div>`;
      }).join('');
    }

    // Search filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('#connectedList .profile-card').forEach(card => {
        const name = card.dataset.nombre || '';
        card.style.display = name.includes(q) ? '' : 'none';
      });
    });

    // === Invitar modal ===
    const modalInvitar = document.getElementById('modalInvitar');
    document.getElementById('btnInvitarWA').addEventListener('click', () => modalInvitar.classList.remove('hidden'));
    document.querySelectorAll('[data-close-invitar]').forEach(el => el.addEventListener('click', () => modalInvitar.classList.add('hidden')));

    document.getElementById('btnInvitarWAModal')?.addEventListener('click', async () => {
      try {
        const res = await fetch(`${API}/red/invitar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ familia_id: familiaId, canal: 'whatsapp' })
        });
        const data = await res.json();
        if (data.ok && data.data?.codigo) {
          const url = `${window.location.origin}/registro-familia.html?ref=${data.data.codigo}`;
          const text = encodeURIComponent(`¡Hola! Te invito a unirte a mi red de confianza en Cuidy. Registrate gratis acá: ${url}`);
          window.open(`https://wa.me/?text=${text}`, '_blank');
        }
      } catch (err) { console.error(err); }
    });

    document.getElementById('btnCopiarLink')?.addEventListener('click', async () => {
      try {
        const res = await fetch(`${API}/red/invitar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ familia_id: familiaId, canal: 'link' })
        });
        const data = await res.json();
        if (data.ok && data.data?.codigo) {
          const url = `${window.location.origin}/registro-familia.html?ref=${data.data.codigo}`;
          await navigator.clipboard.writeText(url);
          document.getElementById('invitarStatus').textContent = '¡Enlace copiado!';
          setTimeout(() => document.getElementById('invitarStatus').textContent = '', 3000);
        }
      } catch (err) { console.error(err); }
    });

    // === Buscar familia modal ===
    const modalBuscarFam = document.getElementById('modalBuscarFam');
    document.getElementById('btnBuscarFam').addEventListener('click', () => modalBuscarFam.classList.remove('hidden'));
    document.querySelectorAll('[data-close-buscar-fam]').forEach(el => el.addEventListener('click', () => modalBuscarFam.classList.add('hidden')));

    document.getElementById('btnBuscarFamSubmit')?.addEventListener('click', async () => {
      const q = document.getElementById('buscarFamInput').value.trim();
      if (!q) return;
      const results = document.getElementById('buscarFamResults');
      results.innerHTML = '<p style="color:#999;font-size:13px;text-align:center">Buscando…</p>';
      try {
        const res = await fetch(`${API}/familias?buscar=${encodeURIComponent(q)}`);
        const data = await res.json();
        const familias = (data.data || []).filter(f => f.id !== familiaId);
        if (!familias.length) {
          results.innerHTML = '<p style="color:#888;font-size:13px;text-align:center;padding:16px 0">No encontramos familias con ese nombre.</p>';
          return;
        }
        results.innerHTML = familias.slice(0, 5).map(f => {
          const init = (f.nombre || '?').charAt(0).toUpperCase();
          return `
            <div class="profile-card" style="margin-bottom:8px">
              <div class="profile-card__avatar" style="background:var(--teal)">${init}</div>
              <div class="profile-card__info" style="flex:1">
                <div class="profile-card__name">${esc(f.nombre)} ${esc(f.apellido || '')}</div>
                <div class="profile-card__meta">${esc(f.localidad || '')}</div>
              </div>
              <button class="btn btn--sm btn--primary btn-conectar" data-id="${f.id}">Conectar</button>
            </div>`;
        }).join('');
        results.querySelectorAll('.btn-conectar').forEach(btn => {
          btn.addEventListener('click', async () => {
            btn.disabled = true; btn.textContent = 'Enviando…';
            try {
              await fetch(`${API}/red/conectar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ familia_id: familiaId, conectar_con_id: btn.dataset.id })
              });
              btn.textContent = 'Enviada ✓';
              btn.classList.remove('btn--primary');
            } catch { btn.textContent = 'Error'; btn.disabled = false; }
          });
        });
      } catch {
        results.innerHTML = '<p style="color:var(--coral);font-size:13px;text-align:center">Error al buscar.</p>';
      }
    });

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  })();
  </script>

  <style>
    .mi-red-page { padding: 24px 0 100px; }

    .mi-red-header { margin-bottom: 16px; }
    .mi-red-header__title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--noche);
    }
    .mi-red-header__sub {
      font-size: 13px;
      color: #888;
      margin-top: 2px;
    }

    .mi-red-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .mi-red-actions .btn { font-size: 13px; }

    .mi-red-search {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--gris);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      margin-bottom: 20px;
      transition: border-color .2s;
    }
    .mi-red-search:focus {
      border-color: var(--teal);
      outline: none;
      box-shadow: 0 0 0 3px rgba(0,109,119,.1);
    }

    .mi-red-section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--gris);
      border-radius: 12px;
      margin-bottom: 8px;
      transition: box-shadow .2s;
    }
    .profile-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .profile-card__avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .profile-card__name {
      font-weight: 600;
      font-size: 14px;
      color: var(--noche);
    }
    .profile-card__meta {
      font-size: 12px;
      color: #888;
      margin-top: 1px;
    }

    .pending-card {
      border: 1px dashed var(--gris);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fff;
    }

    /* Tab bar (same as feed) */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff; border-top: 1px solid var(--gris);
      display: flex; justify-content: space-around;
      padding: 8px 0 env(safe-area-inset-bottom, 8px);
      z-index: 100;
    }
    .tab-bar__item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; color: #999; text-decoration: none; padding: 4px 12px;
    }
    .tab-bar__item--active { color: var(--teal); }
    .tab-bar__item--active svg { stroke: var(--teal); }

    .topbar__nav-active { color: var(--teal) !important; font-weight: 600; }

    @media (min-width: 768px) {
      .tab-bar { display: none; }
      .mi-red-page { padding-bottom: 40px; }
    }
    @media (max-width: 767px) {
      .topbar__nav > a:not(.topbar__nav-active) { display: none; }
    }
  </style>
</body>
</html>
