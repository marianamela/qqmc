<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <title>Admin · Cuidy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="page-admin-login">
  <main class="admin-login">
    <div class="admin-login__card">
      <img src="../assets/logo.svg" alt="Cuidy" class="admin-login__logo" />
      <h1 class="admin-login__title">Panel interno</h1>
      <p class="admin-login__sub">Acceso exclusivo del equipo de Cuidy.</p>

      <form id="loginForm" class="admin-login__form">
        <div class="field">
          <label for="user">Usuario</label>
          <input id="user" name="user" type="text" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <p class="field__error" id="loginError" hidden></p>
        <button type="submit" class="btn btn--primary btn--lg" style="width:100%">Ingresar</button>
      </form>
    </div>
  </main>
  <script src="admin.js"></script>
  <script>
    (() => {
      const form = document.getElementById('loginForm');
      const err = document.getElementById('loginError');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.hidden = true;
        try {
          const res = await fetch('/.netlify/functions/api/admin/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              user: form.user.value.trim(),
              password: form.password.value
            })
          });
          const j = await res.json();
          if (!j.ok) throw new Error(j.error || 'Error');
          window.location.href = 'index.html';
        } catch (e2) {
          err.textContent = e2.message;
          err.hidden = false;
        }
      });
    })();
  </script>
</body>
</html>
