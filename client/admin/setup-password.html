<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <title>Configurar contraseña · Cuidy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="page-admin-login">
  <main class="admin-login">
    <div class="admin-login__card">
      <img src="../assets/logo.svg" alt="Cuidy" class="admin-login__logo" />
      <h1 class="admin-login__title">Configurar contraseña</h1>
      <p class="admin-login__sub">Elegí una contraseña para acceder al panel interno.</p>

      <form id="setupForm" class="admin-login__form">
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" required minlength="6" autocomplete="new-password" />
          <small style="color: var(--muted); font-size: 12px; display: block; margin-top: 4px;">Mínimo 6 caracteres</small>
        </div>
        <div class="field">
          <label for="password2">Repetir contraseña</label>
          <input id="password2" type="password" required minlength="6" autocomplete="new-password" />
        </div>
        <p class="field__error" id="setupError" hidden></p>
        <button type="submit" class="btn btn--primary btn--lg" style="width:100%">Guardar contraseña</button>
      </form>

      <!-- Estado: éxito -->
      <div id="successMsg" hidden>
        <div style="text-align: center; padding: 20px 0;">
          <div style="margin-bottom: 12px; color: var(--teal-dark);"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></div>
          <h2 style="color: var(--teal-dark); margin: 0 0 8px; font-family: 'Montserrat', sans-serif; font-size: 20px;">¡Listo!</h2>
          <p style="color: var(--noche); margin: 0 0 20px; font-size: 14px;">Tu contraseña fue configurada. Ya podés ingresar al panel.</p>
          <a href="login.html" class="btn btn--primary btn--lg" style="width:100%; display: inline-block; text-decoration: none;">Ir al login</a>
        </div>
      </div>

      <!-- Estado: token inválido -->
      <div id="invalidMsg" hidden>
        <div style="text-align: center; padding: 20px 0;">
          <div style="margin-bottom: 12px; color: var(--magenta);"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
          <h2 style="color: var(--magenta); margin: 0 0 8px; font-family: 'Montserrat', sans-serif; font-size: 20px;">Link inválido</h2>
          <p style="color: var(--noche); margin: 0; font-size: 14px;">Este link ya fue usado o expiró. Pedile al administrador que te reenvíe la invitación.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const token = new URLSearchParams(location.search).get('token');
      const form = document.getElementById('setupForm');
      const err = document.getElementById('setupError');
      const successMsg = document.getElementById('successMsg');
      const invalidMsg = document.getElementById('invalidMsg');

      if (!token) {
        form.hidden = true;
        document.querySelector('.admin-login__sub').hidden = true;
        invalidMsg.hidden = false;
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.hidden = true;

        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;

        if (password !== password2) {
          err.textContent = 'Las contraseñas no coinciden';
          err.hidden = false;
          return;
        }

        try {
          const res = await fetch('/.netlify/functions/api/admin/setup-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
          });
          const j = await res.json();
          if (!j.ok) throw new Error(j.error || 'Error');

          // Éxito
          form.hidden = true;
          document.querySelector('.admin-login__title').hidden = true;
          document.querySelector('.admin-login__sub').hidden = true;
          successMsg.hidden = false;
        } catch (e2) {
          if (e2.message.includes('expiró') || e2.message.includes('inválido') || e2.message.includes('utilizado')) {
            form.hidden = true;
            document.querySelector('.admin-login__sub').hidden = true;
            invalidMsg.hidden = false;
          } else {
            err.textContent = e2.message;
            err.hidden = false;
          }
        }
      });
    })();
  </script>
</body>
</html>
